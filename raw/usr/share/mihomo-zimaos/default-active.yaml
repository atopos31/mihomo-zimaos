mode: rule
log-level: info
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true

external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

proxies: []

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,Proxy
